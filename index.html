<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理手记 · 斜面问题</title><meta name="description" content="平板优先的高中物理备课工作台"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%232d6154'/%3E%3Cpath d='M9 30h23L9 12z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"><style>:root{--paper:#f7f7f2;
--ink:#273b35;
--muted:#7a8179;
--green:#2d6154;
--line:#dedfd5;
--pale:#edf1e8;
--gold:#aa7933}
*{box-sizing:border-box}
body{margin:0;
background:var(--paper);
color:var(--ink);
font:15px/1.65 'Microsoft YaHei','PingFang SC',sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;

input,textarea,select{width:100%;

textarea{min-height:130px;

h1,h2,h3,p{margin:0}
h1{font:600 34px/1.4 'Songti SC','SimSun',serif;

h2{font-size:17px}
h3{font-size:16px}
small,.muted{color:var(--muted);

.primary{background:var(--green);

.primary:hover{background:#234d42}
.outline{border-color:var(--line);

.brand{display:flex;

.shell{display:grid;

.shell.closed{grid-template-columns:0 minmax(0,1fr)}
aside.tree{background:#eeefe7;

height:100vh;

.closed aside.tree{visibility:hidden;

overflow:hidden}
.tree .brand{margin:0 7px 38px}
.tree-caption{display:flex;

.tree-row{display:flex;

.tree-row.active{background:#dce6d8;

.tree-row .node{flex:1;
text-align:left;
padding-left:2px;
white-space:nowrap;
font-size:13px}
.tree-row .branch{width:38px;
padding:0;
flex-shrink:0}
.tree-footer{margin:40px 10px 0;
border-top:1px solid var(--line);

color:var(--muted)}
main{min-width:0}
.topbar{display:flex;
gap:10px;
align-items:center;
justify-content:space-between;
padding:12px 30px;
border-bottom:1px solid var(--line);
background:#fafaf6;

z-index:5}
.topbar-left{display:flex;

.top-actions{display:flex;

.save-status{font-size:12px;

.page{max-width:1340px;

.heading{display:flex;

.eyebrow{font:11px Georgia,serif;

.tags{display:flex;

.tag{font-size:11px;

.template-bar{display:flex;

.tabs{display:flex;
gap:5px;

.tabs button{font-size:13px;

.tabs .selected{background:#fff;

.template-hint{font-size:12px;

.blocks{display:grid;

.block{min-width:0;
border-top:1px solid var(--line);
padding-top:11px;
scroll-margin-top:85px}
.block-head{display:flex;
align-items:center;
justify-content:space-between;
gap:5px}
.collapse{display:flex;
gap:12px;
align-items:center;
text-align:left;
padding:0 3px;
width:100%}
.block-no{font:12px Georgia;
color:#94a18c}
.chev{margin-left:auto;
color:#8d9488;
font-size:13px}
.block-body{padding:10px 4px 9px}
.block[data-type=flow],.block[data-type=formula],.block[data-type=questions],.block[data-type=steps]{grid-column:1/-1}
.block[data-type=flow]{background:#e9eee3;
border:1px solid #dce4d4;

.flow{display:flex;
align-items:center;
gap:10px;
justify-content:space-between;
padding:5px 0}
.flow span{font-size:13px}
.flow b{color:#8d9f7a;

.bullets{padding:0;

.bullets li{margin:7px 0;

.bullets li:before{content:'✓';

.diagram-wrap{background:#f0f2ec;
border-radius:7px;
display:flex;
align-items:center;

.diagram-wrap svg{max-height:150px;
width:100%}
.diagram-caption{font-size:11px;

.formula-grid{display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px}
.formula{border:1px solid #e2e4d9;

.formula small{display:block}
.math{font:italic 27px/1.5 Georgia,'Times New Roman',serif;

.formula-note{font-size:12px;

.steps{display:flex;
gap:12px}
.step{flex:1;
min-width:0;
font-size:12px;
padding-left:11px;
border-left:2px solid #d4dfc6}
.step b{display:block;
font-size:13px;
margin-bottom:5px}
.question-filters{display:flex;
gap:6px;
flex-wrap:wrap;
margin:0 0 12px}
.question-filters button{min-height:40px;
padding:5px 14px;
font-size:12px}
.question-filters .selected{background:#e1e9d9;
color:#34582e}
.question-grid{display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:12px}
.question{border:1px solid var(--line);
background:#fffef9;
border-radius:8px;
overflow:hidden;
min-width:0}
.question-top{padding:10px 15px;
background:#eef0e8;
display:flex;
justify-content:space-between;
font-size:11px;
color:#737f65}
.question-content{padding:14px}
.question h3{font-size:14px;
margin-bottom:8px}
.question p{font-size:12px;
white-space:pre-line}
.question .question-text{min-height:90px}
.question .why{margin-top:10px;
padding-top:9px;
border-top:1px dashed var(--line);
color:#7b816e}
.question-actions{display:flex;
flex-wrap:wrap;
gap:1px;
margin-top:9px}
.question-actions button{font-size:11px;
padding:7px}
.question-actions button:first-child{color:var(--green)}
.analysis{background:#eff4e8;
padding:11px;
margin-top:9px;
border-radius:5px}
.mistake-row{padding:9px 12px;
margin-bottom:7px;
border-left:3px solid #c6a464;
background:#f5efe2;
font-size:12px}
.mistake-row b{display:block;
color:#8c6229}
.board-teaser{display:flex;
justify-content:space-between;
align-items:center;
background:#e8eee6;
padding:15px;
border-radius:7px}
.board-teaser p{font-size:12px;
color:var(--muted)}
.edit-controls{display:flex;
flex-wrap:wrap;
gap:4px;
margin:8px 0;
padding:6px;
background:#edf0e7;
border-radius:6px}
.edit-controls button{font-size:12px;
padding:6px 10px;
border:1px solid #d7dfcf;
background:#fff}
.drag-handle{touch-action:none}
.dragging{opacity:.5;
outline:2px dashed var(--green)}
.editing-banner{font-size:12px;
background:#e6ecdf;
padding:10px 15px;
border-radius:7px;
margin-bottom:16px}
.lecture{display:block;
max-width:860px;
margin:auto;
border-left:1px solid #d3ddc8;
padding-left:30px}
.lecture .block{position:relative;
margin:0 0 24px;
padding:15px 19px;
background:#fffef9;
border:1px solid var(--line);
border-radius:8px}
.lecture .block-no{position:absolute;
left:-48px;
top:21px;
background:var(--paper);
padding:4px}
.lecture .question-grid{grid-template-columns:1fr}
.lecture .question-text{min-height:0}
.lecture .diagram-wrap svg{max-height:240px}
.library-nav{display:flex;
gap:8px;
overflow:auto;
margin-bottom:20px;
padding-bottom:7px}
.library-nav button{white-space:nowrap;
background:#edf0e6;
border:1px solid var(--line)}
.library-nav button.selected{background:var(--green);
color:#fff}
.library{display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:18px}
.library .block{grid-column:auto;
border:1px solid var(--line);
border-radius:8px;
padding:12px 16px;
background:#fffef9}
.library .block[data-type=questions]{grid-column:1/-1}
.library .formula-grid,.library .steps,.library .flow{display:flex;
flex-direction:column;
align-items:stretch}
.library .flow b{display:none}
.library .formula{margin-bottom:4px}
.empty{padding:36px;
text-align:center;
color:var(--muted);
grid-column:1/-1}
.image-content{max-width:100%;
max-height:280px;
object-fit:contain;
display:block;
margin:auto;
cursor:zoom-in}
.image-missing{background:#eeeee5;
padding:25px;
text-align:center;
font-size:13px;
color:var(--muted)}
.plain-text{white-space:pre-line;
font-size:13px}
.add-bottom{width:100%;
border:1px dashed #b9c8ad;
margin-top:24px;
color:var(--green)}
dialog{color:var(--ink);
border:1px solid var(--line);
border-radius:14px;
padding:25px;
width:min(620px,calc(100vw - 28px));
max-height:90dvh;
overflow:auto;
box-shadow:0 20px 90px #21382724;
background:var(--paper)}
dialog::backdrop{background:#26342b55}
.modal-head{display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px}
.modal-head h2{font-size:21px}
.add-grid{display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px}
.add-grid button{background:#fffef9;
border:1px solid var(--line);
padding:19px 8px;
min-height:92px;
text-align:left}
.add-grid strong{display:block;
color:var(--green);
font-size:24px;
margin-bottom:4px}
.form-row{margin:13px 0}
.form-row label{display:block;
font-size:13px;
margin-bottom:5px}
.form-actions{display:flex;
justify-content:flex-end;
gap:10px;
margin-top:21px}
.preview-image{max-width:100%;
max-height:230px;
display:block;
margin:12px auto}
.upload{display:block;
border:1px dashed #a3b292;
border-radius:8px;
padding:19px;
text-align:center;
background:#edf1e7}
.upload input{margin-top:10px}
.drawer{margin:0 0 0 auto;
height:100dvh;
max-height:100dvh;
border-radius:14px 0 0 14px;
width:min(650px,100vw);
animation:slide .2s ease-out}
.board-sheet{margin-top:20px;
background:#fffef9;
border:1px solid var(--line);
border-radius:8px;
padding:23px}
.board-sheet h3{font:24px 'SimSun',serif;
margin-bottom:20px}
.board-line{padding:13px 0;
border-bottom:1px solid #dfe5d7;
font-size:17px;
white-space:pre-line}
.board-line b{font-size:13px;
display:block;
color:#798c6c}
.chalk{background:#25473f;
color:#f0efdc;
border:8px solid #9e8a64;
box-shadow:inset 0 0 30px #102b2944}
.chalk .board-line{border-color:#ffffff24;
font-family:'KaiTi','SimSun',serif;
font-size:21px}
.chalk .board-line b{color:#d8d49c}
.board-question{margin-top:15px;
padding:12px;
border:1px dashed #829580;
font-size:13px;
white-space:pre-line}
.zoom{width:min(1100px,95vw)}
.zoom img{width:100%;
max-height:75vh;
object-fit:contain}
.search-result{width:100%;
text-align:left;
border-bottom:1px solid var(--line);
border-radius:0;
padding:14px 6px}
.search-result small{display:block}
.directory{padding:30px 0}
.directory button{display:block;
min-width:250px;
text-align:left;
border:1px solid var(--line);
margin-top:12px;
background:#fffef9}
#toast{position:fixed;
bottom:26px;
left:50%;
transform:translateX(-50%);
padding:11px 20px;
border-radius:8px;
background:#284b3f;
color:white;
z-index:30;
font-size:13px;
max-width:90%;
opacity:0;
pointer-events:none}
#toast.visible{opacity:1}
.storage-warning{color:#9c5b26}
.drop-target{outline:2px solid var(--green)}
@keyframes slide{from{transform:translateX(100%)}
to{transform:translateX(0)}
}
@media(min-width:1400px){.page{padding:32px 48px}
.question p,.bullets li,.flow span{font-size:14px}
}
@media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,1fr)}
.page{padding:20px 23px}
.topbar{padding:10px 18px}
.template-hint{display:none}
.top-actions button{padding:8px 10px}
.save-status{display:none}
.question-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.steps{flex-wrap:wrap}
.step{flex:1 1 28%}
}
@media(max-width:900px){.shell{grid-template-columns:0 minmax(0,1fr)}
aside.tree{position:fixed;
z-index:12;
width:236px;
box-shadow:15px 0 40px #26382922}
.closed aside.tree{width:0}
.page{padding:20px}
.topbar-left .muted{display:none}
.heading h1{font-size:29px}
.flow{flex-wrap:wrap;
justify-content:flex-start}
.blocks{gap:18px}
.topbar{gap:5px}
.top-actions{gap:1px}
.tabs button{padding:8px 11px}
.template-bar{align-items:flex-start}
.heading{align-items:flex-start}
.formula-grid{gap:7px}
.formula{padding:10px}
.math{font-size:23px}
}
@media(max-width:560px){.blocks,.library{display:block}
.block{margin-bottom:17px}
.question-grid{grid-template-columns:1fr}
.topbar{flex-wrap:wrap}
.top-actions{margin-left:auto}
.topbar-left button{padding:8px}
.page{padding:17px}
.heading .muted{display:none}
.formula-grid{grid-template-columns:1fr}
.formula{display:flex;
align-items:center;
justify-content:space-between}
.add-grid{grid-template-columns:repeat(2,1fr)}
.lecture{padding-left:23px}
.lecture .block-no{left:-39px}
.tabs button{font-size:12px}
.breadcrumb{line-height:1.4}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;
scroll-behavior:auto!important}
}

:root{scrollbar-gutter:stable}

.page{padding-top:18px}

.breadcrumb{margin-bottom:8px}

.template-bar{margin-top:17px;
margin-bottom:16px}

.tags{margin-top:8px}

.diagram-wrap svg{max-height:150px}

.question-filters button,.tabs button{min-height:44px}

:root{--diagram-force:#326656;--diagram-gravity:#a86635;--diagram-component:#657b3d;--diagram-muted:#97a391;--diagram-plane:#eff2e7;--diagram-block:#c9d8b6}
.shell{transition:grid-template-columns .28s ease}
aside.tree{min-width:0;transition:opacity .22s ease,transform .28s ease,visibility .28s;transform:translateX(0);opacity:1}
.closed aside.tree{padding:27px 16px;opacity:0;transform:translateX(-100%);pointer-events:none}
.tree .brand{margin-bottom:24px}
.tree-caption{letter-spacing:1px;margin-bottom:5px}
.tree-hide{font-size:12px;letter-spacing:0;border:1px solid #d3dbcb;background:#f8faf4;padding:7px 10px}
.tree-locate{width:100%;text-align:left;font-size:12px;color:var(--green);border:1px dashed #c3cfb9;background:#f3f6ee;margin:5px 0 15px}
.tree-navigation{padding:0 0 5px}
.tree-row{margin:4px 0;padding-left:calc(var(--depth)*7px);min-height:46px;border:1px solid transparent;transition:background .18s,border-color .18s,box-shadow .18s}
.tree-row.active{background:#dbe7d5;border-color:#bdcdb2;box-shadow:inset 3px 0 0 var(--green)}
.tree-row .branch{width:40px;min-height:44px;border-radius:7px;display:grid;place-items:center}
.tree-row .branch:hover{background:#d7e1cd}
.branch-chevron{display:block;font:24px/1 Georgia;transition:transform .24s ease}
.branch[aria-expanded=true] .branch-chevron{transform:rotate(90deg)}
.tree-leaf{display:grid;place-items:center;width:40px;flex-shrink:0;color:#839975;font-size:15px}
.tree-row .node{min-width:0;white-space:normal;display:flex;gap:6px;align-items:center;justify-content:space-between;line-height:1.45;padding:9px 7px 9px 0;border-radius:5px;font-size:13px}
.node-current{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.tree-row button:active,.tree-locate:active,.tree-hide:active{transform:scale(.96);background:#cfddc5}
.tree-children{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .26s ease,opacity .2s ease,visibility .26s}
.tree-children.is-open{grid-template-rows:1fr;opacity:1;visibility:visible}
.tree-children-inner{overflow:hidden;min-height:0}
.tree-children .tree-children-inner{border-left:1px solid #d3ddcb;margin-left:9px}
.block#block-essentials{grid-column:1/-1}
.mastery-list{display:grid;grid-template-columns:1fr 1fr;gap:18px 25px}
.mastery-item{display:flex;gap:11px;align-items:flex-start;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.mastery-number{font:italic 19px/30px Georgia;color:#81976e;width:24px;flex-shrink:0}
.mastery-item h3{font-size:15px;margin:2px 0 8px}
.mastery-item p{font-size:13px;line-height:1.9;color:#526052}
.mastery-item .mastery-check{background:#edf1e5;border-radius:5px;margin-top:10px;padding:8px 10px;color:#48633d;font-size:12px}
.lecture .mastery-list,.library .mastery-list{grid-template-columns:1fr}
.board-drawer{width:min(890px,94vw);padding:23px 27px}
.board-drawer.board-wide{width:min(1120px,100vw)}
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.copy-sheet{padding:25px;background:#fffef9}
.copy-heading{border-bottom:2px solid #abbc98;padding-bottom:18px;margin-bottom:5px}
.copy-heading>span{font-size:11px;letter-spacing:2px;color:#82906f}
.copy-heading h3{margin:8px 0 10px;font-size:26px;line-height:1.5}
.copy-heading p{font-size:13px;line-height:1.85;color:#65735b}
.board-panel{padding:18px 0;border-bottom:1px solid #d7dfcc;break-inside:avoid}
.board-panel h4{font-size:16px;margin:0 0 14px;display:flex;gap:12px;align-items:center}
.board-panel h4>span{font:italic 18px Georgia;color:#889d72}
.board-pair{display:grid;grid-template-columns:minmax(210px,.95fr) minmax(0,1.05fr);align-items:center;gap:22px}
.board-pair figure{margin:0;min-width:0}
.board-diagram{width:100%;display:block;font:19px Georgia,'Times New Roman',serif}
.board-diagram .diagram-small{font:12px 'Microsoft YaHei',sans-serif;fill:var(--diagram-muted)}
.board-pair figcaption{font-size:11px;line-height:1.7;color:#7b896c;padding:4px 7px}
.board-equations{border-left:1px solid #dce3d1;padding-left:21px;min-width:0}
.board-equation{margin:0 0 14px}
.board-equation:last-child{margin-bottom:0}
.board-equation>span{display:block;font-size:12px;color:#758568;margin-bottom:3px}
.board-equation>div{font:21px/1.65 Georgia,'Times New Roman',serif;overflow-wrap:anywhere}

</style><script>window.PHYSICS_PUBLICATION={"version":"2026-09-27T15:23:59.335Z","state":{"nodes":[{"id":"root","title":"高中物理","parent":null},{"id":"mechanics","title":"力学","parent":"root"},{"id":"forces","title":"相互作用","parent":"mechanics"},{"id":"newton","title":"牛顿运动定律","parent":"mechanics"},{"id":"second","title":"牛顿第二定律","parent":"newton"},{"id":"models","title":"动力学模型","parent":"newton"},{"id":"incline","title":"斜面问题","parent":"models"}],"blocks":[{"id":"essentials","type":"text","title":"必须掌握","text":"先选研究对象，再找真实受力｜把物块单独拿出来分析：重力 mg 竖直向下，支持力 N 垂直斜面向外；斜面粗糙且存在相对滑动或滑动趋势时，还要分析摩擦力。速度和加速度不是力，不要因为物块正在运动就多画一个力。｜自查：每一根力的箭头，能否说出是谁施加的？\n坐标沿斜面建立，分解就有了目的｜通常把 x 轴沿斜面、y 轴垂直斜面。重力的两个分量分别是 mg sinθ 和 mg cosθ；重力与垂直斜面向内方向的夹角等于斜面倾角 θ。分力是重力的等效替代，不是新增的两个力。｜自查：令 θ = 0，沿斜面分量应为 0，垂直分量应为 mg。\n摩擦力先判方向，再求大小｜沿固定斜面下滑时，滑动摩擦力向上；上滑时，滑动摩擦力向下，大小均为 f = μN。静止时先判断滑动趋势，静摩擦力由平衡条件求出，不能直接套 f = μN。｜自查：物块到了最高点，不能不加判断地沿用上滑时的摩擦方向。\n两条运动方程，分别解决两个方向｜以沿斜面向下为正，下滑时有 mg sinθ − f = ma；固定斜面上不脱离且无其他外力时，垂直方向 N − mg cosθ = 0。先用垂直方向求 N，再代入 f = μN，最后求 a。｜自查：若增加一个斜向拉力，支持力的方程也要跟着改。\n看清加速度，再判断运动状态｜下滑时 a = g(sinθ − μcosθ)，这里 a 带正负号。a > 0 表示向下加速；a \u003c 0 表示正在下滑的物块减速，不能直接说它已经向上运动。速度减到零后，需要重新分析能否保持静止。｜自查：判断加速或减速，要同时看速度方向和加速度方向。","collapsed":false,"knowledgePointId":"incline","sortOrder":1},{"id":"thread","type":"flow","title":"核心主线","text":"识别模型 → 受力分析 → 建立坐标 → 分解重力 → 列牛顿第二定律 → 判断运动状态","collapsed":false,"knowledgePointId":"incline","sortOrder":2},{"id":"diagram","type":"diagram","title":"模型图 · 受力分析","text":"物块沿固定粗糙斜面下滑，滑动摩擦力沿斜面向上。只画真实受力，分力不作为额外的力。","collapsed":false,"knowledgePointId":"incline","sortOrder":4},{"id":"formulas","type":"formula","title":"核心公式","text":"沿斜面分量 | mg sinθ\n垂直斜面分量 | mg cosθ\n牛顿第二定律 | ΣF = ma","note":"固定斜面、无其他外力且不脱离斜面时：N = mg cosθ。滑动摩擦力 f = μN。","collapsed":false,"knowledgePointId":"incline","sortOrder":5},{"id":"process","type":"steps","title":"标准解题流程","text":"选对象｜隔离物块，明确斜面固定\n画受力｜重力、支持力、摩擦力\n建坐标｜沿斜面向下为 x 正方向\n列方程｜mg sinθ − f = ma；N − mg cosθ = 0\n验结果｜结合初速度判断加速、减速或转向","collapsed":false,"knowledgePointId":"incline","sortOrder":6},{"id":"questions","type":"questions","title":"典型例题","items":[{"id":"q1","title":"光滑斜面上的下滑","category":"基础","difficulty":"★","tags":"受力分析，牛顿第二定律","text":"一物块从倾角为 30° 的固定光滑斜面上由静止释放。取 g = 10 m/s²，求加速度与 2 s 内的位移。","note":"先用最简单模型，建立沿斜面列式的习惯。","analysis":"沿斜面：mg sin30° = ma，得 a = 5 m/s²。\n由静止出发，s = ½at² = 10 m。","knowledgePointId":"incline","sortOrder":0},{"id":"q2","title":"斜面 + 滑动摩擦","category":"典型","difficulty":"★★","tags":"受力分析，摩擦力，牛顿第二定律","text":"物块沿倾角 37° 的固定粗糙斜面下滑，动摩擦因数 μ = 0.25。取 g = 10 m/s²，sin37° = 0.6，cos37° = 0.8。求物块加速度。","note":"用于训练标准斜面受力分析，区分重力分量与真实受力。","analysis":"垂直斜面：N = mg cos37°。\n滑动摩擦力沿斜面向上，f = μN。\n沿斜面：mg sin37° − μmg cos37° = ma。\na = 10 × (0.6 − 0.25 × 0.8) = 4 m/s²，沿斜面向下。","knowledgePointId":"incline","sortOrder":1},{"id":"q3","title":"沿斜面上滑，会发生什么？","category":"变式","difficulty":"★★","tags":"摩擦力方向，运动状态","text":"物块以 6 m/s 的初速度沿 30° 粗糙固定斜面上滑，μ = √3/6，g = 10 m/s²。求上滑至最高点的时间。","note":"对比上滑与下滑，强调摩擦力方向随相对运动变化。","analysis":"上滑过程中，重力沿斜面分量和摩擦力都向下。\n取向上为正，a = −g(sin30° + μcos30°) = −7.5 m/s²。\n到最高点 v = 0，t = 6/7.5 = 0.8 s。停止后的运动要重新判断。","knowledgePointId":"incline","sortOrder":2}],"knowledgePointId":"incline","sortOrder":3},{"id":"mistakes","type":"mistake","title":"易错点","text":"sin / cos 写反｜沿斜面是 mg sinθ，垂直斜面是 mg cosθ。\n默认 N = mg｜支持力需由垂直斜面的运动方程确定。\n摩擦力总与速度反向？｜滑动摩擦力与接触面的相对运动方向相反；静摩擦力看趋势。\n多画一个“运动方向的力”｜运动不需要额外的力来维持。","collapsed":false,"knowledgePointId":"incline","sortOrder":7},{"id":"variants","type":"text","title":"常见变式","text":"沿斜面上滑：摩擦力与重力沿斜面分量同向\n外力拉动：先分解外力，再求支持力和摩擦力\n临界静止：静摩擦力由平衡条件求出，检验是否超过最大静摩擦力","collapsed":true,"knowledgePointId":"incline","sortOrder":8},{"id":"board","type":"board","title":"板书","text":"停下后重新判断｜速度减为零后，重新判断静摩擦力能否维持平衡，不能直接延续滑动阶段的结论。","collapsed":false,"panels":[{"scene":"forces","title":"隔离物块，画出三个真实力","caption":"物块沿斜面下滑，摩擦力沿斜面向上。","formulas":[["重力 · 竖直向下","G = mg"],["支持力 · 垂直斜面向外","N"],["滑动摩擦力 · 沿斜面向上","f = μN"]],"note":"μ 是动摩擦因数。不要多画“运动方向的力”。"},{"scene":"components","title":"沿斜面建系，将重力分解","caption":"虚线是辅助线，两个分量合起来等效于重力。","formulas":[["沿斜面向下的分量","Gₓ = mg sinθ"],["垂直斜面向内的分量","G⊥ = mg cosθ"]],"note":"θ 是斜面倾角，也是重力与垂直斜面向内方向的夹角。列式时不能将重力和这两个分量重复计入。"},{"scene":"equations","title":"分方向列方程，联立求加速度","caption":"约定 x 正方向沿斜面向下，y 正方向垂直斜面向外。","formulas":[["y 方向 · 无垂直斜面的加速度","N − mg cosθ = 0"],["先求支持力，再求摩擦力","N = mg cosθ；f = μmg cosθ"],["x 方向 · 牛顿第二定律","mg sinθ − f = ma"],["代入并约去质量 m","a = g(sinθ − μcosθ)"]],"note":"a > 0：下滑加速；a = 0：匀速下滑；a \u003c 0：下滑减速。这里只讨论已经下滑的阶段。"}],"knowledgePointId":"incline","sortOrder":0},{"id":"notes","type":"text","title":"我的补充","text":"讲题前先问：物块相对斜面向哪边运动？\n让学生先画受力图，再写公式。","collapsed":false,"knowledgePointId":"incline","sortOrder":9},{"id":"idmujxe712ryzj5","type":"board","title":"板书","text":"dasdsdsd","knowledgePointId":"incline","sortOrder":10,"tags":""},{"id":"idmujxeonnuqzro","type":"board","title":"板书","text":"","knowledgePointId":"incline","sortOrder":11},{"id":"idmujxftj944f8o","type":"board","title":"板书","text":"","knowledgePointId":"incline","sortOrder":12}],"boardQuestions":[],"orders":{"quick":["thread","essentials","diagram","formulas","process","questions","mistakes","variants","board","notes"]},"template":"quick","cardOrder":["board","essentials","thread","questions","diagram","formulas","process","mistakes","variants","notes","idmujxe712ryzj5","idmujxeonnuqzro","idmujxftj944f8o"]},"images":{}};</script></head>

window.CardRecords = {

};
window.createCardWorkbench = function(api){
 const {state,btn,esc,body,save,render,show,close,editor,board,toast,uid,images,imageHTML,getEditing,setEditing}=api;

 const truncate=(s,n=95)=>s.length>n?s.slice(0,n)+'…':s;
 function count(b){if(b.type==='questions')return `${b.items.length} 道例题`;if(b.type==='board')return `${b.panels?.length||lines(b).length} 组图文步骤`;if(b.type==='image')return '1 张图片';if(b.type==='flow')return `${(b.text||'').split('→').length} 个步骤`;return `${lines(b).length} ${b.id==='essentials'?'个核心要求':'条内容'}`;}

 function moduleCard(b){const core=isCore(b),icon={essentials:'✓',thread:'→',board:'▤',questions:'▣'}[b.id]||{image:'▧',formula:'ƒ',mistake:'!',text:'T',diagram:'∠'}[b.type]||'◇';
 return `<article class="module-card ${core?'core-card':'support-card'}" data-card="${b.id}" data-group="${core?'core':'support'}" id="card-${b.id}"><div class="card-top"><span class="card-symbol" aria-hidden="true">${icon}</span><span class="card-count">${esc(count(b))}</span>${btn('card-menu','•••','card-menu',`data-id="${b.id}" aria-label="${esc(b.title)}卡片菜单"`)}</div>${btn('card-open',`<h2>${esc(b.title)}</h2>${b.type==='image'?imageHTML(b,'card-thumbnail'):`<p class="card-summary">${esc(summary(b))}</p>`}<span class="card-open-label">${b.type==='board'?'打开板书':b.type==='questions'?'查看例题':'展开查看'} <span aria-hidden="true">↗</span></span>`,'card-main',`data-id="${b.id}" aria-label="打开${esc(b.title)}"`)}${tools(b.id)}</article>`;
 }
 function question(q,b){return `<article class="question compact-question" data-card="${q.id}" data-group="questions-${b.id}" id="card-${q.id}"><div class="question-top"><span>${esc(q.category||'典型')} · ${esc(q.difficulty||'★★')}</span>${btn('card-menu','•••','card-menu',`data-id="${q.id}" aria-label="${esc(q.title)}卡片菜单"`)}</div>${btn('question-open',`${q.imageId?imageHTML(q,'question-thumb'):`<div class="question-text-thumb">${esc(truncate(q.text||'待补充题干',110))}</div>`}<div class="question-content"><h3>${esc(q.title||'未命名例题')}</h3><div class="tags">${smallTags(q)}</div><p class="why">${esc(truncate(q.note||'点击查看题干、解析与备注。',70))}</p><span class="card-open-label">查看完整题目 ↗</span></div>`,'question-main',`data-q="${q.id}" aria-label="打开例题${esc(q.title)}"`)}${tools(q.id)}</article>`;}
 function flowBody(b){const steps=(b.text||'').split('→').map(s=>s.trim());const explanations=['先确认斜面是否固定、是否光滑，以及物块正在怎样运动。','隔离物块，找出每个真实力的施力物体。','沿斜面与垂直斜面建系，并明确正方向。','把重力分到两条坐标轴上，不重复计入分力。','分别列两方向方程，先求支持力，再求加速度。','结合速度方向判断加速或减速；停止后重新判断。'];return `<ol class="teaching-route">${steps.map((s,i)=>`<li><b>${esc(s)}</b><p>${esc(b.stepNotes?.[i]||explanations[i]||'明确这一步的条件与结果。')}</p></li>`).join('')}</ol>`;}
 function masteryBody(b){const tips=[['每个力都能找到来源，后面的合力方程才可靠。','把速度、加速度当成力，或漏掉接触力。'],['让坐标顺着约束方向，两个方向的方程更容易分开。','混淆正弦和余弦，或将重力与分力重复相加。'],['摩擦方向与大小取决于接触状态，不能只背一个公式。','静止时直接使用滑动摩擦公式，停止后不重新判断。'],['先处理垂直方向，可以正确确定支持力和摩擦力。','一律认为 N = mg，或者有外力时仍沿用旧方程。'],['加速度说明速度怎样变化，速度决定此刻向哪边运动。','把负加速度理解成已经反向运动。']];const defaults=window.PHYSICS_SEED.blocks.find(x=>x.id==='essentials').text.split('\n');return `<div class="mastery-list">${lines(b).map((line,i)=>{const [title,detail,check]=line.split('｜');const index=defaults.findIndex(x=>x.split('｜')[0]===title);return `<article class="mastery-item"><span class="mastery-number">${i+1}</span><div><small>学生必须做到什么</small><h3>${esc(title)}</h3>${detail?`<p>${esc(detail)}</p>`:''}${index>=0?`<small>为什么重要</small><p>${esc(tips[index][0])}</p><small>常见问题</small><p>${esc(tips[index][1])}</p>`:''}${check?`<small>教师检查问题</small><p class="mastery-check">${esc(check)}</p>`:''}</div></article>`;}).join('')}</div>`;}
 function workspace(){
  const b=get(focusedId);
  const banner=`<div class="arrange-banner"><span>⠿ 整理模式 · 按住卡片拖动，或用「•••」移动与删除</span>${btn('edit','完成整理','primary')}</div>`;
  if(b)return `${banner}<section class="focus-view"><div class="focus-toolbar">${btn('overview','← 收起并返回总览','outline')}<span class="muted">${esc(count(b))}</span>${btn('card-menu','•••','outline',`data-id="${b.id}" aria-label="${esc(b.title)}卡片菜单"`)}</div><div class="focus-heading"><h2>${esc(b.title)}</h2><p>${b.type==='questions'?'先浏览，再打开值得讲的一道题。':'看完后收起，随时回到斜面问题总览。'}</p></div><div id="block-${b.id}" class="focus-content">${b.id==='essentials'&&b.type==='text'?masteryBody(b):b.type==='flow'?flowBody(b):body(b)}</div>${b.type==='questions'?btn('new','＋ 新增例题','add-bottom','data-type="questions"'):''}</section>`;
  const blocks=ordered();return `${banner}<div class="overview-label"><span>主卡区域</span><small>← 左右滑动翻阅 → · ${window.PHYSICS_PUBLICATION?'课堂阅读':'长按整理'}</small></div><nav class="deck-index" aria-label="主卡导航">${blocks.filter(isCore).map(b=>btn('deck-select',esc(b.title),'',`data-id="${b.id}" aria-pressed="false"`)).join('')}${btn('deck-prev','←','','aria-label="向左翻阅"')}${btn('deck-next','→','','aria-label="向右翻阅"')}</nav><div class="core-grid" tabindex="0" role="region" aria-label="左右滑动翻阅主卡">${blocks.filter(isCore).map(moduleCard).join('')||'<p class="empty">核心卡片已移除，可使用撤销恢复。</p>'}</div><div class="other-heading"><h2>次级内容 <small>${blocks.filter(b=>!isCore(b)).length}</small></h2><span>公式、提醒和随手收集的资料</span></div><div class="support-grid">${blocks.filter(b=>!isCore(b)).map(moduleCard).join('')}${btn('add','＋ 添加内容','support-add')}</div>`;
 }
 function selectCard(id){selectedId=id;paintSelection();document.querySelector(`#card-${id}`)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
 function paintSelection(){document.querySelectorAll('.core-card').forEach(el=>{const on=el.dataset.card===selectedId;el.classList.toggle('is-selected',on);const button=el.querySelector('.card-main');button?.setAttribute('aria-pressed',String(on));const hint=el.querySelector('.card-open-label');if(hint)hint.textContent=on?'已选中 · 再点一次展开 ↗':'点击选中 · 再点展开 ↗';});document.querySelectorAll('[data-action="deck-select"]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.id===selectedId)));}
 function openCard(id){const b=get(id);if(!b)return;deckScroll=document.querySelector('.core-grid')?.scrollLeft||0;if(b.type==='board'){board();return;}overviewScroll=window.scrollY;focusedId=id;render();window.scrollTo({top:0,behavior:'instant'});}
 function overview(){focusedId=null;render();window.scrollTo({top:overviewScroll,behavior:'instant'});}
 function setArrange(value,rerender=true){setEditing(value);if(rerender)render();else{document.querySelector('.shell')?.classList.toggle('arranging',value);document.querySelectorAll('[data-action="edit"]').forEach(b=>{b.textContent=value?'✓ 完成整理':'⠿ 整理';});}}
 function menu(id){const r=record(id);if(!r)return;show(r.title||'卡片菜单',`<div class="card-menu-grid">${btn('card-edit','✎ 编辑内容','outline',`data-id="${id}"`)}${btn('card-copy','▣ 复制卡片','outline',`data-id="${id}"`)}${btn('card-move','↕ 移动到…','outline',`data-id="${id}"`)}${btn('card-type','◇ 修改类型','outline',`data-id="${id}"`)}${btn('card-delete','删除卡片','outline danger-text',`data-id="${id}"`)}</div>${r.imageId?btn('recognize','识别为图文','future-action'):''}${findQuestion(id)?btn('student','标记为学生错题','future-action'):''}`);}
 function group(id){const b=get(id);return b?(isCore(b)?'core':'support'):`questions-${findQuestion(id)?.b.id}`;}
 function siblings(id){const b=get(id);return b?ordered().filter(x=>isCore(x)===isCore(b)).map(x=>x.id):(findQuestion(id)?.b.items||[]).map(q=>q.id);}
 function reorder(id,target,after=false){if(id===target||group(id)!==group(target))return false;const b=get(id);const list=b?state.cardOrder:findQuestion(id).b.items.map(q=>q.id);const source=list.indexOf(id);if(source<0||!list.includes(target))return false;list.splice(source,1);list.splice(list.indexOf(target)+(after?1:0),0,id);if(!b){const owner=findQuestion(id).b;owner.items.sort((a,b)=>list.indexOf(a.id)-list.indexOf(b.id));}save();render();return true;}
 function moveOne(id,delta){const ids=siblings(id),idx=ids.indexOf(id),target=ids[idx+delta];if(target)reorder(id,target,delta>0);else toast('已经在这一组的边缘');}
 function moveMenu(id){const ids=siblings(id);show('移动卡片',`<p class="muted">${get(id)?(isCore(get(id))?'在四个核心模块中调整位置。':'在其他内容中调整位置。'):'在当前例题集合中调整位置。'}</p><div class="move-list">${ids.filter(i=>i!==id).map(i=>btn('card-place',`放到「${esc(record(i).title)}」前面`,'outline',`data-id="${id}" data-target="${i}"`)).join('')}${ids.length>1?btn('card-place','移到最后','outline',`data-id="${id}" data-target="${ids.filter(i=>i!==id).at(-1)}" data-after="true"`):'<p class="empty">这一组只有一张卡片。</p>'}</div>`);}
 function remove(id){const r=record(id);if(!r)return;show('删除「'+(r.title||'卡片')+'」',`<p>移除这张卡片及其内容。删除后可以撤销。</p><div class="form-actions">${btn('close','取消','outline')}${btn('card-delete-confirm','删除','primary',`data-id="${id}"`)}</div>`);}
 function removeConfirmed(id){const b=get(id),found=findQuestion(id);if(!b&&!found)return;const affected=new Set(b?(b.items||[]).map(q=>q.id):[id]);lastRemoved={item:structuredClone(b||found.q),ownerId:b?null:found.b.id,index:b?state.blocks.indexOf(b):found.b.items.indexOf(found.q),orderIndex:state.cardOrder.indexOf(id),boardRefs:state.boardQuestions.filter(q=>affected.has(q))};if(b){state.blocks=state.blocks.filter(b=>b.id!==id);state.cardOrder=state.cardOrder.filter(x=>x!==id);}else found.b.items=found.b.items.filter(q=>q.id!==id);state.boardQuestions=state.boardQuestions.filter(q=>!affected.has(q));if(focusedId===id)focusedId=null;save();close();render();toast('已删除，可点击页面下方「撤销删除」');}
 function copy(id){const r=record(id);if(!r)return;const clone=structuredClone(r);clone.id=uid();clone.title=(r.title||'未命名')+' · 副本';if(get(id)){if(clone.items)clone.items=clone.items.map(q=>({...q,id:uid()}));state.blocks.push(clone);state.cardOrder.splice(state.cardOrder.indexOf(id)+1,0,clone.id);}else{const owner=findQuestion(id).b;owner.items.splice(owner.items.findIndex(q=>q.id===id)+1,0,clone);}save();close();render();toast('已复制卡片');}
 function editCard(id){close();const b=get(id);if(b){if(b.type==='questions'){show('编辑例题模块',`<form id="card-title-form"><label for="module-title">模块名称</label><input id="module-title" name="title" value="${esc(b.title)}"><div class="form-actions"><button type="submit" class="primary">保存</button></div></form>`);document.querySelector('#card-title-form').onsubmit=e=>{e.preventDefault();b.title=new FormData(e.target).get('title')||'例题';save();close();render();};}else editor(b.type,id);}else{const found=findQuestion(id);if(found)editor('questions',found.b.id,id);}}
 function typeMenu(id){const r=record(id);if(!r)return;if(r.items?.length){show('修改类型',`<p>这是一个例题集合。请在单道例题的菜单中修改类型，以保留集合里的所有题目。</p>`);return;}show('修改卡片类型',`<p class="muted">原图、文字和备注会保留。</p><div class="card-menu-grid">${['text','image','formula','mistake','board','questions','link'].map(t=>btn('card-convert',typeNames[t],'outline',`data-id="${id}" data-type="${t}" ${t==='image'&&!r.imageId?'disabled':''}`)).join('')}</div>`);}
 function convert(id,type){const r=record(id);if(!r)return;const found=findQuestion(id);if(type==='questions'&&!found){let owner=state.blocks.find(b=>b.type==='questions'&&b.id!==id);if(!owner){owner={id:uid(),title:'例题',type:'questions',items:[]};state.blocks.push(owner);}owner.items.push({...structuredClone(r),id:uid(),type:'question',category:'典型',difficulty:'★★',analysis:r.analysis||'',note:r.note||r.text});state.blocks=state.blocks.filter(b=>b.id!==id);focusedId=owner.id;}else if(found&&type!=='questions'){const block={...structuredClone(r),id:uid(),type};state.blocks.push(block);found.b.items=found.b.items.filter(q=>q.id!==id);state.boardQuestions=state.boardQuestions.filter(q=>q!==id);focusedId=null;}else if(!found)r.type=type;save();close();render();toast('类型已修改，原有内容已保留');}
 function newCard(type){if(type==='image'){close();document.querySelector('#quick-images').click();return;}if(type==='node'){editor(type);return;}close();const b={id:uid(),type:type==='module'?'text':type,title:type==='module'?'自定义模块':typeNames[type]||'文字笔记',text:'',knowledgePointId:'incline'};if(type==='questions'){let owner=state.blocks.find(b=>b.type==='questions');if(!owner){owner={id:uid(),type:'questions',title:'例题',items:[]};state.blocks.push(owner);}const q={id:uid(),title:'新例题',text:'',category:'典型',difficulty:'★★',tags:'',note:'',analysis:'',knowledgePointId:'incline'};owner.items.push(q);focusedId=owner.id;save();render();editor('questions',owner.id,q.id);return;}state.blocks.push(b);state.cardOrder.push(b.id);focusedId=null;save();render();editor(b.type,b.id);}
 function ingest(files){let added=0;for(const file of files){if(!file.type.startsWith('image/'))continue;const imageId=uid();images.set(imageId,URL.createObjectURL(file));const block={id:uid(),type:'image',title:file.name.replace(/\.[^.]+$/,'')||'新图片',text:'',tags:'',imageId,imageKind:'image',knowledgePointId:'incline',originalImage:{assetId:imageId,storage:'session',fileName:file.name,mimeType:file.type,size:file.size}};window.CardRecords.image(block);state.blocks.push(block);state.cardOrder.splice(coreIds.length,0,block.id);added++;}if(!added){toast('请选择图片文件');return;}focusedId=null;save();render();document.querySelector('.other-heading')?.scrollIntoView({block:'start',behavior:'smooth'});toast(`已添加 ${added} 张图片，可稍后补充信息`);}
 function openQuestion(id){const found=findQuestion(id);if(!found)return;const q=found.q;show(q.title||'例题',`<div class="question-detail">${imageHTML(q,'detail-image')}<div class="tags"><span class="tag">${esc(q.category)} · ${esc(q.difficulty)}</span>${smallTags(q)}</div><h3>题干</h3><p>${esc(q.text||'题干见原图，可在编辑中补充文字。')}</p><h3>解析</h3><p>${esc(q.analysis||'尚未补充解析。')}</p><h3>板书解法</h3><p>${esc(q.boardSolution||q.analysis||'可在编辑中补充适合学生抄写的解法。')}</p><h3>备注 · 为什么值得做</h3><p>${esc(q.note||'尚未补充备注。')}</p><div class="form-actions">${btn('card-edit','编辑','outline',`data-id="${id}"`)}${btn('board-add',state.boardQuestions.includes(id)?'已加入板书':'加入板书','outline',`data-q="${id}"`)}${btn('close','返回例题列表','primary')}</div></div>`,'question-dialog');}
 function afterRender(){paintSelection();const deck=document.querySelector('.core-grid');if(deck){deck.scrollLeft=deckScroll;deck.addEventListener('scroll',()=>{deckScroll=deck.scrollLeft;},{passive:true});}const shell=document.querySelector('.shell');shell?.classList.toggle('arranging',getEditing());const old=document.querySelector('#delete-undo');if(old)old.remove();if(lastRemoved){const el=document.createElement('div');el.id='delete-undo';el.innerHTML=`<span>已删除卡片</span>${btn('card-undo','撤销删除','outline')}${btn('dismiss-undo','✕','','aria-label="关闭撤销提示"')}`;document.querySelector('#app').append(el);}}
 function handle(el){const {action:a,id,type,q,target}=el.dataset;switch(a){
  case 'card-open':if(!getEditing()){if(isCore(get(id))&&selectedId!==id)selectCard(id);else openCard(id);}return true;
  case 'deck-select':selectCard(id);return true;
  case 'deck-prev':case 'deck-next':{const deck=document.querySelector('.core-grid');deck?.scrollBy({left:(a==='deck-next'?1:-1)*deck.clientWidth*.65,behavior:'smooth'});return true;}
  case 'question-open':if(!getEditing())openQuestion(q);return true;
  case 'overview':close();overview();return true;
  case 'edit':setArrange(!getEditing());return true;
  case 'card-menu':menu(id);return true;
  case 'question-more':menu(q);return true;
  case 'card-edit':editCard(id);return true;
  case 'card-copy':copy(id);return true;
  case 'card-move':moveMenu(id);return true;
  case 'card-up':moveOne(id,-1);return true;
  case 'card-down':moveOne(id,1);return true;
  case 'card-place':close();reorder(id,target,el.dataset.after==='true');return true;

function render(){
 const node=state.nodes.find(n=>n.id===current)||state.nodes[0];
 app.innerHTML=`<div class="shell ${treeOpen?'':'closed'}"><aside class="tree" aria-label="知识树" ${treeOpen?'':'inert'}><div class="brand"><span class="brand-symbol">∠</span>物理手记</div><div class="tree-caption">我的知识树 ${btn('tree','⇤ 收起','tree-hide','aria-label="收起知识树"')}</div>${btn('tree-locate','◎ 定位当前知识点','tree-locate')}<nav class="tree-navigation" aria-label="知识目录">${tree()}</nav><div class="tree-footer">一节一节，积累自己的教学体系。<br><br>第一版原型 · 01 个知识点</div></aside><main><header class="topbar"><div class="topbar-left">${btn('tree',treeOpen?'☰ 收起目录':'☰ 知识树','','aria-label="切换知识树"')}<span class="muted">个人备课工作台</span></div><div class="top-actions">${btn('search','⌕ 搜索')}${btn('board','▤ 板书')}${btn('edit',edit?'✓ 完成整理':'⠿ 整理',edit?'primary':'outline')}${btn('more','•••','','aria-label="更多操作"')}</div></header><div class="page"><nav class="breadcrumb" aria-label="当前位置">${path(current).map(n=>btn('node',esc(n.title),'',`data-id="${n.id}"`)).join('<span>›</span>')}</nav><div class="heading"><div><div class="eyebrow">PHYSICS NOTEBOOK / 01</div><h1>${esc(node.title)}</h1>${current==='incline'?'<div class="tags"><span class="tag">力学</span><span class="tag">动力学模型</span><span class="tag">受力分析</span></div>':''}</div><div>${btn('publish','↗ 导出发布','primary')}${btn('add','＋ 添加内容','primary')}<div class="save-status ${storageOK?'':'storage-warning'}" style="text-align:right;margin-top:9px">${storageOK?'○ 内容与排序保存在此浏览器':'本次修改暂未持久保存'}</div></div></div>${current==='incline'?cards.workspace():`<div class="directory"><p class="muted">这是目录节点。第一版的完整内容位于「斜面问题」。</p>${node.parent?btn('node','← 返回上一级','',`data-id="${node.parent}"`):''}${state.nodes.filter(n=>n.parent===current).map(n=>btn('node',esc(n.title)+' →','',`data-id="${n.id}"`)).join('')}${btn('node','打开斜面问题 →','primary','data-id="incline"')}</div>`}</div></main></div>`;
 cards.afterRender();
}
function show(title,html,cls=''){lastFocus=document.activeElement;modal.className=cls;modal.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2>${btn('close','✕','','aria-label="关闭"')}</div>${html}`;if(!modal.open)modal.showModal();}
function close(){modal.close();lastFocus?.isConnected&&lastFocus.focus();}
function addMenu(){show('添加到「斜面问题」',`<p class="muted" style="margin-bottom:15px">先收进来，之后再慢慢整理。</p><div class="add-grid">${[['image','▧','图片'],['text','T','文字笔记'],['formula','ƒ','公式'],['questions','▣','例题'],['mistake','!','易错点'],['board','▤','板书'],['link','↗','关联内容'],['module','＋','新建模块']].map(([type,icon,label])=>btn('new',`<strong>${icon}</strong>${label}`,'',`data-type="${type}"`)).join('')}</div>`);}
function field(name,label,value='',tag='input',extra=''){return `<div class="form-row"><label for="f-${name}">${label}</label><${tag} id="f-${name}" name="${name}" ${extra}${tag==='input'?` value="${esc(value)}">`:`>${esc(value)}</${tag}>`}</div>`;}
function editor(type,blockId=null,qId=null){const b=state.blocks.find(b=>b.id===blockId);const item=qId?b.items.find(q=>q.id===qId):b;const isQuestion=type==='questions',isImage=type==='image'||isQuestion;let imageId=item?.imageId;
show(item?'编辑'+(qId?'例题':'内容'):'添加'+(labels[type]||'模块'),`<form id="editor"><input type="hidden" name="kind" value="${type}">${isImage?`<label class="upload">${isQuestion?'题目图片（可选，也可以直接写题干）':'选择图片，立即预览'}<input name="file" id="image-file" type="file" accept="image/*"></label><div id="image-preview">${item?imageHTML(item,'preview-image'):''}</div>`:''}${field('title','标题（可选）',item?.title||'')}${type==='image'?`<div class="form-row"><label for="f-imageType">类型</label><select name="imageType" id="f-imageType"><option value="image">普通图片</option><option value="questions">例题</option><option value="board">板书</option><option value="other">其他</option></select></div>`:''}${isImage?`<div class="form-row" id="category-row" ${!isQuestion?'hidden':''}><label for="f-category">例题分类</label><select id="f-category" name="category">${['基础','典型','变式','综合'].map(c=>`<option ${c===(item?.category||'典型')?'selected':''}>${c}</option>`).join('')}</select></div>${field('tags','标签（可选，用逗号分隔）',item?.tags||'')}`:''}${field('text',isQuestion?'题干（可选）':type==='image'?'备注（可选）':type==='formula'?'公式（每行一条，可写「名称 | 公式」）':'内容（每行一条）',item?.text||'', 'textarea')}${isQuestion?field('note','为什么值得讲（可选）',item?.note||'')+field('analysis','解析（可选）',item?.analysis||'','textarea')+field('boardSolution','板书解法（可选）',item?.boardSolution||'','textarea')+field('difficulty','难度（可选）',item?.difficulty||'★★'):type==='formula'?field('note','适用条件（可选）',item?.note||''):''}<div class="form-actions">${btn('close','取消','outline')}<button class="primary" type="submit">保存</button></div></form>`);
const form=modal.querySelector('form');let pendingURL,pendingFile;
if(type==='image'&&item?.imageKind)form.querySelector('[name=imageType]').value=item.imageKind;
form.querySelector('[name=imageType]')?.addEventListener('change',e=>form.querySelector('#category-row').hidden=e.target.value!=='questions');
form.querySelector('[name=file]')?.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('请选择图片文件');e.target.value='';return;}if(pendingURL)URL.revokeObjectURL(pendingURL);pendingFile=file;pendingURL=URL.createObjectURL(file);form.querySelector('#image-preview').innerHTML=`<img class="preview-image" src="${pendingURL}" alt="图片预览">`;});
form.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(form),value=k=>String(f.get(k)||'').trim();if(type==='image'&&!imageId&&!pendingURL){toast('请先选择一张图片');return;}if(!isImage&&!value('text')&&!value('title')){toast('写一句内容或标题就可以保存');return;}if(pendingURL){imageId=uid();images.set(imageId,pendingURL);pendingURL=null;}const targetType=type==='image'?value('imageType'):type;const base={...(item||{}),title:value('title')|| (targetType==='questions'?'未命名例题':type==='image'?'未命名图片':labels[type]||'新模块'),text:value('text'),tags:value('tags'),...(imageId?{imageId}:{})};
if(pendingFile)base.originalImage={assetId:imageId,storage:'session',fileName:pendingFile.name,mimeType:pendingFile.type,size:pendingFile.size};
if(isQuestion||targetType==='questions'){const record={...base,id:qId||uid(),category:value('category')||'典型',difficulty:value('difficulty')||'★★',note:value('note')||(type==='image'?value('text'):''),analysis:value('analysis'),boardSolution:value('boardSolution')};if(qId){Object.assign(item,record);}else{let qb=state.blocks.find(x=>x.type==='questions');if(!qb){qb={id:uid(),type:'questions',title:'典型例题',items:[]};state.blocks.push(qb);}qb.items.push(record);qb.collapsed=false;if(blockId)state.blocks=state.blocks.filter(x=>x.id!==blockId);category='全部';}}
else if(type==='node'){state.nodes.push({id:uid(),title:base.title,parent:current});expanded.add(current);}
else{const result={...base,type:type==='module'?'text':type,id:blockId||uid(),...(type==='formula'?{note:value('note')}:{})};if(type==='image')result.imageKind=targetType; if(item)Object.assign(item,result);else state.blocks.push(result);}
save();close();current='incline';libraryType='all';render();toast('已保存');});
modal.addEventListener('close',()=>{if(pendingURL)URL.revokeObjectURL(pendingURL);},{once:true});}
function board(){
 const boards=state.blocks.filter(b=>b.type==='board');
 const questions=state.blocks.filter(b=>b.type==='questions').flatMap(b=>b.items).filter(q=>state.boardQuestions.includes(q.id));
 show('斜面问题 · 课堂板书',`<div class="board-toolbar"><div class="tabs">${btn('board-mode','结构化板书',boardMode==='structure'?'selected':'','data-mode="structure"')}${btn('board-mode','黑板预览',boardMode==='chalk'?'selected':'','data-mode="chalk"')}</div>${btn('board-wide',boardWide?'收回抽屉':'展开抄写','outline',`aria-pressed="${boardWide}"`)}</div><div class="board-sheet copy-sheet ${boardMode==='chalk'?'chalk':''}"><div class="copy-heading"><span>课堂笔记 / 动力学模型</span><h3>固定斜面上的下滑物块</h3><p>条件：斜面固定，物块已在下滑且不脱离斜面；仅受重力、支持力和滑动摩擦力。μ 为动摩擦因数。</p></div>${boards.map(b=>`${(b.panels||[]).map((panel,i)=>`<section class="board-panel"><h4><span>0${i+1}</span>${esc(panel.title)}</h4><div class="board-pair"><figure>${window.drawBoardDiagram(panel.scene)}<figcaption>${esc(panel.caption)}</figcaption></figure><div class="board-equations">${panel.formulas.map(([label,formula])=>`<div class="board-equation"><span>${esc(label)}</span><div>${esc(formula)}</div></div>`).join('')}</div></div><p class="board-reminder">${esc(panel.note)}</p></section>`).join('')}${(b.text||'').split('\n').filter(Boolean).map(l=>{const [title,...rest]=l.split('｜');return `<div class="board-line"><b>${esc(title)}</b>${esc(rest.join('｜'))}</div>`;}).join('')}`).join('')}${state.blocks.filter(b=>b.type==='image'&&b.imageKind==='board').map(b=>imageHTML(b)).join('')}${questions.map(q=>`<div class="board-question"><b>例题 · ${esc(q.title)}</b>${imageHTML(q)}<p>${esc(q.text)}</p></div>`).join('')}${boards.length||questions.length?'':'<p>还没有板书。可以添加板书内容，或把例题加入这里。</p>'}</div>`,`drawer board-drawer ${boardWide?'board-wide':''}`);
}
function search(){show('搜索当前知识点',`<input id="search-input" placeholder="试试：摩擦、受力、公式" aria-label="搜索内容"><div id="search-results"><p class="empty">搜索标题、文字、题目和标签</p></div>`);const input=modal.querySelector('input');input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();const hits=[];if(q)state.blocks.forEach(b=>{if([b.title,b.text,b.tags,b.note].join(' ').toLowerCase().includes(q))hits.push({b,title:b.title,type:labels[b.type]||'内容'});if(b.items)b.items.forEach(i=>{if([i.title,i.text,i.tags,i.note].join(' ').toLowerCase().includes(q))hits.push({b,title:i.title,type:'例题 · '+i.category});});});modal.querySelector('#search-results').innerHTML=hits.length?hits.map(h=>btn('result',`${esc(h.title)}<small>${esc(h.type)} · 斜面问题</small>`,'search-result',`data-id="${h.b.id}"`)).join(''):`<p class="empty">${q?'没有找到，试试其他关键词。':'搜索标题、文字、题目和标签'}</p>`;});input.focus();}
function move(id,offset){const list=ordered();const i=list.findIndex(b=>b.id===id),j=i+offset;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];state.orders[state.template]=list.map(b=>b.id);save();render();document.getElementById('block-'+id)?.scrollIntoView({block:'nearest'});}
function confirmDelete(title,fn){show('删除'+title,`<p>删除后会从三个模板的共享内容中移除。</p><div class="form-actions">${btn('close','取消','outline')}${btn('confirm-delete','确认删除','primary')}</div>`);modal.querySelector('[data-action=confirm-delete]').onclick=()=>{fn();save();close();render();toast('已删除');};}
function getQ(id){return state.blocks.filter(b=>b.type==='questions').flatMap(b=>b.items).find(q=>q.id===id);}
function handle(e){const el=e.target.closest('[data-action]');if(!el)return;
const action=el.dataset.action;
if(publication&&!['card-open','question-open','overview','deck-select','deck-prev','deck-next','node','branch','tree','tree-locate','board','board-mode','board-wide','close','zoom','search','result','parent','filter','analysis'].includes(action))return;
if(action==='publish'){show('导出发布内容',`<p>把当前文字、图片、例题、板书和卡片顺序打包成一个网页文件。</p><p style="margin-top:12px">下载 <b>斜面问题-发布包.zip</b>，解压后取出包内的 <b>index.html</b>，上传到 GitHub Pages 的发布目录，替换原文件。Pad 刷新即可查看。</p><p class="muted" style="margin-top:12px">发布版只供阅读，不读取 Pad 的旧草稿。发布到公开网站的内容可被他人访问，请确认其中没有不想公开的资料。这里只下载文件，不会自动上传。</p><div class="form-actions">${btn('close','取消','outline')}${btn('publish-download','下载发布包','primary')}</div>`);return;}
if(action==='publish-download'){close();window.PhysicsPublish.download(state,images,toast);return;}
if(cards.handle(el))return;const {action:a,id,q,type}=el.dataset;const b=state.blocks.find(b=>b.id===id);switch(a){
case 'tree':toggleTree();break;
case 'branch':{const open=!expanded.has(id);open?expanded.add(id):expanded.delete(id);el.setAttribute('aria-expanded',String(open));const children=document.getElementById('children-'+id);children.classList.toggle('is-open',open);children.inert=!open;break;}
case 'tree-locate':path(current).forEach(n=>expanded.add(n.id));render();app.querySelector('[aria-current="page"]')?.scrollIntoView({block:'nearest'});break;
case 'node':current=id;path(id).forEach(n=>expanded.add(n.id));if(innerWidth<=900)treeOpen=false;render();break;
case 'edit':edit=!edit;render();break;
case 'template':state.template=el.dataset.template;save();render();break;
case 'library':libraryType=type;render();break;
case 'collapse':b.collapsed=!b.collapsed;save();render();break;
case 'add':addMenu();break;
case 'new':editor(type);break;
case 'close':close();break;
case 'board':board();break;
case 'board-mode':boardMode=el.dataset.mode;board();break;
case 'board-wide':boardWide=!boardWide;board();break;
case 'filter':category=el.dataset.category;render();break;
case 'block-edit':if(b.type==='questions'){show('编辑例题模块',`<form id="rename">${field('title','模块名称',b.title)}<p class="muted">单道题目请使用题目卡片里的「编辑」。</p><div class="form-actions"><button type="submit" class="primary">保存</button></div></form>`);modal.querySelector('form').onsubmit=e=>{e.preventDefault();b.title=new FormData(e.target).get('title')||'典型例题';save();close();render();};}else editor(b.type,id);break;
case 'block-delete':confirmDelete('「'+b.title+'」',()=>{state.blocks=state.blocks.filter(x=>x.id!==id);});break;
case 'question-delete':confirmDelete('这道例题',()=>{b.items=b.items.filter(x=>x.id!==q);state.boardQuestions=state.boardQuestions.filter(x=>x!==q);});break;
case 'question-edit':editor('questions',id,q);break;
case 'q-up':case 'q-down':{const i=b.items.findIndex(x=>x.id===q),j=i+(a==='q-up'?-1:1);if(j>=0&&j<b.items.length){[b.items[i],b.items[j]]=[b.items[j],b.items[i]];save();render();}break;}
case 'up':move(id,-1);break;case 'down':move(id,1);break;
case 'analysis':{const item=getQ(q);show(item.title+' · 解析',`<p class="plain-text">${esc(item.analysis||'这道题还没有解析。进入编辑模式后可以补充。')}</p>`);break;}
case 'board-add':if(!state.boardQuestions.includes(q)){state.boardQuestions.push(q);save();render();toast('已加入板书');}else toast('这道题已经在板书中');break;
case 'question-more':show('例题 · 更多',`${btn('student','标记为学生错题','outline')}${state.boardQuestions.includes(q)?btn('board-remove','从板书移除','outline',`data-q="${q}"`):''}`);break;
case 'student':toast('此功能将在后续版本开发。');break;
case 'board-remove':state.boardQuestions=state.boardQuestions.filter(x=>x!==q);save();close();render();toast('已从板书移除');break;
case 'zoom':{const src=images.get(el.dataset.image);if(src)show('图片预览',`<img src="${esc(src)}" alt="放大的内容图片">`,'zoom');break;}
case 'search':search();break;
case 'result':b.collapsed=false;current='incline';libraryType='all';category='全部';close();render();document.getElementById('block-'+id)?.scrollIntoView({block:'start',behavior:'smooth'});break;
case 'more':show('工作台选项',`${btn('parent','← 返回上一级','outline')}${btn('expand-all','展开所有模块','outline')}${btn('collapse-all','收起所有模块','outline')}<p class="muted" style="margin-top:18px">第一版仅在当前浏览器保存文字、例题资料与模板排序。图片为临时预览；学生错题入口是演示。没有云同步。</p>`);break;
case 'parent':{const n=state.nodes.find(n=>n.id===current);if(n.parent)current=n.parent;close();render();break;}
case 'expand-all':case 'collapse-all':state.blocks.forEach(b=>b.collapsed=a==='collapse-all');save();close();render();break;
}}
app.addEventListener('click',handle);modal.addEventListener('click',handle);modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
const cards=window.createCardWorkbench({state,btn,esc,body,save,render,show,close,editor,board,toast,uid,images,imageHTML,getEditing:()=>edit,setEditing:value=>edit=value,setCurrent:value=>current=value,resetCategory:()=>category='全部'});
document.querySelector('#quick-images').addEventListener('change',event=>{cards.ingest([...event.target.files]);event.target.value='';});
if(!publication)window.installCardGestures({arrange:()=>cards.setArrange(true,false),render,reorder:(...args)=>cards.reorder(...args),remove:id=>cards.remove(id)});
render();
if(publication){document.body.classList.add('published-reader');const note=document.createElement('p');note.className='publication-note';note.textContent='课堂阅读版 · 发布时间 '+new Date(publication.version).toLocaleString('zh-CN')+' · 内容由电脑端统一发布';document.body.prepend(note);}
})();
</script></body></html>
